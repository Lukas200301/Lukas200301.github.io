    <script>/* command line open: load its font before the first paint (js/terminal-font.js) */try{if(JSON.parse(sessionStorage.getItem('cli-state')||'{}').open){var l=document.querySelector('link[href*="css/styles.css"]');if(l)document.write('<script src="'+l.href.replace(/css\/styles\.css/,'js/terminal-font.js')+'"><\/script>')}}catch(e){}</script>
    <script>/* page transition: if we arrived via a site link, draw the finished cover before the first paint (js/script.js then lifts it); an open command line is drawn too, above it */
    try{var d=sessionStorage.getItem('pt');if(d){sessionStorage.removeItem('pt');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var r=document.documentElement;r.classList.add('pt-enter');d=(d==='1'?'cd ~':d).replace(/[^\w~\/ .-]/g,'');r.setAttribute('data-pt-dest',d);var n='Lukas200301',l='';for(var k=0;k<n.length;k++)l+='<span class="pl" style="--k:'+k+'">'+n[k]+'</span>';document.write('<div class="pt-ov pt-ov--enter" aria-hidden="true"><div class="pt-ov__panel"><div class="pt-ov__grid"></div></div><div class="pt-ov__edge"></div><div class="pt-ov__hud"><div class="pt-ov__frame"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><span class="pt-ov__ring"></span><span class="pt-ov__ring r2"></span><div class="pt-ov__name">'+l+'</div><div class="pt-ov__bar"><b></b></div><div class="pt-ov__dest"><span style="--n:'+d.length+'">'+d+'</span><i class="pt-ov__caret"></i></div></div></div></div>')}}}catch(e){}try{var c=JSON.parse(sessionStorage.getItem('cli-state')||'{}');if(c.open){var L='';(c.lines||[]).forEach(function(x){L+='<div class="cli__ln '+x[0]+'">'+x[1]+'</div>'});var nv=sessionStorage.getItem('cli-nav')==='1'&&document.documentElement.classList.contains('pt-enter');document.documentElement.classList.add('cli-open');document.write('<div class="cli in instant'+(nv?' cli--nav':'')+'" data-pre role="dialog" aria-modal="true" aria-label="Command line"><div class="cli__win"><div class="cli__bar"><span class="cli__dots"><i></i><i></i><i></i></span><span class="cli__title">'+(c.title||'')+'</span><button class="cli__close" type="button" aria-label="Close command line"><i class="fas fa-xmark"></i></button></div><div class="cli__body" tabindex="-1"><div class="cli__out" aria-live="polite">'+L+'</div><form class="cli__line" autocomplete="off"><label class="cli__ps">'+(c.ps||'')+'</label><input class="cli__in" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Command" autofocus><span class="cli__ghost" aria-hidden="true"></span></form></div><div class="cli__hint"><span><kbd>Tab</kbd> complete</span><span><kbd>↑</kbd><kbd>↓</kbd> history</span><span><kbd>Ctrl</kbd><kbd>L</kbd> clear</span><span><kbd>Esc</kbd> close</span></div></div></div>');var b=document.querySelector('.cli[data-pre] .cli__body');if(b)b.scrollTop=b.scrollHeight}}catch(e){}</script>

<body>
    <main id="main" class="wrap">
        <header class="list-hero">
            <nav class="crumbs" aria-label="Breadcrumb">
                <a class="breadcrumb-link" href="../"><i class="fas fa-house"></i> Home</a>
                <span class="breadcrumb-separator">/</span>
                <span class="breadcrumb-current">Tools</span>
            </nav>
            <h1 class="page-title"><i class="fas fa-screwdriver-wrench"></i>Tools</h1>
            <p class="page-lede">Small utilities I built because I needed them. No sign-up, no tracking, and everything runs locally in your browser.</p>
            <div class="page-meta"><span class="meta-item"><i class="fas fa-wrench"></i><span id="toolCount">8</span> tools</span><span class="meta-item"><i class="fas fa-shield-halved"></i>Client-side only</span></div>
        </header>
        <div class="list-bar">
            <div class="list-bar__inner">
                <label class="list-search">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" data-list-search placeholder="Search tools" aria-label="Search tools" autocomplete="off">
                    <kbd>/</kbd>
                </label>
                <div class="filters" id="filters" role="group" aria-label="Filter"></div>
                <select class="sort-select" id="sort" aria-label="Sort"></select>
            </div>
        </div>
        <p class="list-count" id="count" aria-live="polite"></p>
        <section class="card-grid" id="grid" aria-label="Tools"></section>
    </main>

    <script src="../js/script.js?v=20261009a"></script>
    <script src="../js/list.js?v=20261009a"></script>
    <script>fetch('https://lukas200301-counter.vercel.app/api/counter').catch(() => {});</script>
    <script>
    (function () {
        const esc = List.esc;
        const TOOLS = [
            { title: 'JavaScript & TypeScript Playground', desc: 'Write and run JavaScript or TypeScript in the browser and see the console output instantly.', icon: 'fab fa-js', url: './tjs-playground/', cat: 'Developer', tags: ['javascript', 'typescript', 'editor'] },
            { title: 'Regex Tester', desc: 'Test regular expressions against your text with live highlighting and match details.', icon: 'fas fa-asterisk', url: './regex-tester/', cat: 'Developer', tags: ['regex', 'pattern', 'testing'] },
            { title: 'Secure Password Generator', desc: 'Generate strong passwords with the Web Crypto API and see how long they would take to crack.', icon: 'fas fa-key', url: './pwgenerator/', cat: 'Security', tags: ['password', 'entropy', 'crypto'] },
            { title: 'Browser Fingerprint Analyzer', desc: 'See what websites can learn about you: canvas, WebGL, audio and hardware fingerprints.', icon: 'fas fa-fingerprint', url: './fingerprint/', cat: 'Security', tags: ['privacy', 'browser', 'webgl'] },
            { title: 'Color Palette Generator', desc: 'Generate harmonious color palettes and export them as CSS, JSON or images.', icon: 'fas fa-palette', url: './color-generator/', cat: 'Design', tags: ['colors', 'palette', 'css'] },
            { title: 'QR Code Generator', desc: 'Create QR codes for links, text and Wi-Fi logins, then download them as images.', icon: 'fas fa-qrcode', url: './qr-code/', cat: 'Utility', tags: ['qr', 'wifi', 'url'] },
            { title: 'Globedata', desc: 'Spin a 3D globe and click any country to see its population, capital, languages and more.', icon: 'fas fa-earth-europe', url: './globedata/', cat: 'Data', tags: ['globe', '3d', 'countries'] },
            { title: 'YouTube Tag Generator', desc: 'Get tag and keyword ideas for a video title to improve search visibility.', icon: 'fab fa-youtube', url: './youtube-tag-generator/', cat: 'Content', tags: ['youtube', 'seo', 'tags'] },
            { title: 'Subnet Calculator', desc: 'Work out network, broadcast, host range and mask for any IPv4 CIDR, and split it into smaller subnets.', icon: 'fas fa-network-wired', url: './subnet-calculator/', cat: 'Network', tags: ['ipv4', 'cidr', 'subnet'] },
            { title: 'JSON & YAML Formatter', desc: 'Validate, pretty-print, minify and convert between JSON and YAML with exact error positions.', icon: 'fas fa-code', url: './json-yaml/', cat: 'Developer', tags: ['json', 'yaml', 'format'] },
            { title: 'Base64, URL & JWT Decoder', desc: 'Encode and decode Base64, URL, HTML entities, hex and binary, and inspect JWT tokens.', icon: 'fas fa-right-left', url: './encoder/', cat: 'Developer', tags: ['base64', 'jwt', 'url'] },
            { title: 'Cron Expression Helper', desc: 'Turn cron expressions into plain English and see the next times they will run.', icon: 'fas fa-clock-rotate-left', url: './cron/', cat: 'Developer', tags: ['cron', 'schedule', 'linux'] },
            { title: 'Hash & Checksum Generator', desc: 'MD5, SHA-1, SHA-256, SHA-512 and CRC32 for text or files, and verify download checksums.', icon: 'fas fa-hashtag', url: './hash/', cat: 'Security', tags: ['sha256', 'md5', 'checksum'] },
            { title: 'Timestamp Converter', desc: 'Convert Unix timestamps to dates and back across time zones, with a world clock.', icon: 'fas fa-clock', url: './timestamp/', cat: 'Utility', tags: ['unix', 'time zone', 'date'] },
            { title: 'Markdown Live Preview', desc: 'Write Markdown and see it rendered as you type, then copy or download the HTML.', icon: 'fab fa-markdown', url: './markdown/', cat: 'Content', tags: ['markdown', 'preview', 'html'] },
            { title: 'Text Diff Checker', desc: 'Compare two texts side by side or inline, with line and word-level highlights.', icon: 'fas fa-code-compare', url: './diff/', cat: 'Developer', tags: ['diff', 'compare', 'text'] },
            { title: 'DNS Lookup', desc: 'Query A, MX, TXT, NS, PTR and more over DNS-over-HTTPS, check SPF and DMARC, and compare Cloudflare with Google.', icon: 'fas fa-globe', url: './dns-lookup/', cat: 'Network', tags: ['dns', 'mx', 'dmarc'] },
            { title: 'MAC Address Lookup', desc: 'Find the vendor of a MAC address, spot randomized and multicast addresses, and bulk-check arp output.', icon: 'fas fa-ethernet', url: './mac-lookup/', cat: 'Network', tags: ['mac', 'oui', 'vendor'] },
            { title: 'Unit Converter', desc: 'GB vs GiB, Mbit/s vs MB/s and real download times, plus time, temperature, length and mass.', icon: 'fas fa-scale-balanced', url: './unit-converter/', cat: 'Utility', tags: ['bytes', 'bandwidth', 'units'] }
        ];
        document.getElementById('toolCount').textContent = TOOLS.length;
        List.init({
            items: TOOLS,
            noun: ['tool', 'tools'],
            filterKeys: t => [t.cat],
            searchText: t => [t.title, t.desc, t.cat, t.tags.join(' ')].join(' '),
            sorters: { 'Name': (a, b) => a.title.localeCompare(b.title), 'Category': (a, b) => a.cat.localeCompare(b.cat) || a.title.localeCompare(b.title) },
            render: (t) => `<a class="card spot" data-tilt href="${t.url}">
                <div class="card__top"><span class="card__icon"><i class="${t.icon}"></i></span><span class="badge">${esc(t.cat)}</span></div>
                <div><h2 class="card__title">${esc(t.title)}</h2><p class="card__desc">${esc(t.desc)}</p></div>
                <div class="card__tags">${t.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
                <div class="card__foot"><span><i class="fas fa-lock"></i> Runs in your browser</span><span class="card__go">Open <i class="fas fa-arrow-right"></i></span></div>
            </a>`
        });
    })();
    </script>
