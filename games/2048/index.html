<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2048 Game - A classic number puzzle game by Lukas200301">
    <meta name="keywords" content="2048, puzzle, game, numbers, strategy">
    <meta name="author" content="Lukas200301">
    <title>2048 Game | Lukas200301</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Martian+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/styles.css?v=20261008j">
    <link rel="stylesheet" href="../../css/pages.css?v=20261008j">
    <link rel="stylesheet" href="2048-styles.css?v=20261008j">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://github.com/Lukas200301.png">
    <script>/* command line open: load its font before the first paint (js/terminal-font.js) */try{if(JSON.parse(sessionStorage.getItem('cli-state')||'{}').open){var l=document.querySelector('link[href*="css/styles.css"]');if(l)document.write('<script src="'+l.href.replace(/css\/styles\.css/,'js/terminal-font.js')+'"><\/script>')}}catch(e){}</script>
    <script>/* page transition: if we arrived via a site link, draw the finished cover before the first paint (js/script.js then lifts it); an open command line is drawn too, above it */
    try{var d=sessionStorage.getItem('pt');if(d){sessionStorage.removeItem('pt');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var r=document.documentElement;r.classList.add('pt-enter');d=(d==='1'?'cd ~':d).replace(/[^\w~\/ .-]/g,'');r.setAttribute('data-pt-dest',d);var n='Lukas200301',l='';for(var k=0;k<n.length;k++)l+='<span class="pl" style="--k:'+k+'">'+n[k]+'</span>';document.write('<div class="pt-ov pt-ov--enter" aria-hidden="true"><div class="pt-ov__panel"><div class="pt-ov__grid"></div></div><div class="pt-ov__edge"></div><div class="pt-ov__hud"><div class="pt-ov__frame"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><span class="pt-ov__ring"></span><span class="pt-ov__ring r2"></span><div class="pt-ov__name">'+l+'</div><div class="pt-ov__bar"><b></b></div><div class="pt-ov__dest"><span style="--n:'+d.length+'">'+d+'</span><i class="pt-ov__caret"></i></div></div></div></div>')}}}catch(e){}try{var c=JSON.parse(sessionStorage.getItem('cli-state')||'{}');if(c.open){var L='';(c.lines||[]).forEach(function(x){L+='<div class="cli__ln '+x[0]+'">'+x[1]+'</div>'});var nv=sessionStorage.getItem('cli-nav')==='1'&&document.documentElement.classList.contains('pt-enter');document.documentElement.classList.add('cli-open');document.write('<div class="cli in instant'+(nv?' cli--nav':'')+'" data-pre role="dialog" aria-modal="true" aria-label="Command line"><div class="cli__win"><div class="cli__bar"><span class="cli__dots"><i></i><i></i><i></i></span><span class="cli__title">'+(c.title||'')+'</span><button class="cli__close" type="button" aria-label="Close command line"><i class="fas fa-xmark"></i></button></div><div class="cli__body" tabindex="-1"><div class="cli__out" aria-live="polite">'+L+'</div><form class="cli__line" autocomplete="off"><label class="cli__ps">'+(c.ps||'')+'</label><input class="cli__in" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Command" autofocus><span class="cli__ghos <body>

    <!-- Main Content -->
    <main class="game-page-no-nav">
        <!-- Header Section -->
        <section class="game-hero" id="hero">
            <div class="section-container">
                <div class="game-header">
                    <div class="game-info">
                        <div class="game-breadcrumb">
                            <a href="../../index.html" class="breadcrumb-link">
                                <i class="fas fa-home"></i>
                                Home
                            </a>
                            <span class="breadcrumb-separator">/</span>
                            <a href="../index.html" class="breadcrumb-link">
                                <i class="fas fa-gamepad"></i>
                                Games
                            </a>
                            <span class="breadcrumb-separator">/</span>
                            <span class="breadcrumb-current">2048</span>
                        </div>
                        <h1 class="game-title">
                            <i class="fas fa-th-large"></i>
                            2048
                        </h1>
                        <p class="game-description">
                            Join numbers and get to the 2048 tile! Swipe with your fingers or use your arrow keys to move the tiles.
                        </p>
                        <div class="game-meta">
                            <div class="meta-item">
                                <i class="fas fa-trophy"></i>
                                <span id="highScore">Best: 0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Game Section -->
        <section class="game-section" id="play" style="padding-top: var(--space-lg);">
            <div class="section-container">
                <div class="game-container">
                    <!-- Game Controls -->
                    <div class="game-controls">
                        <div class="score-container">
                            <div class="score-box">
                                <div class="score-label">Score</div>
                                <div class="score-value" id="score">0</div>
                            </div>
                            <div class="score-box">
                                <div class="score-label">Best</div>
                                <div class="score-value" id="bestScore">0</div>
                            </div>
                        </div>
                        
                        <div class="game-buttons">
                            <button class="game-btn primary" id="newGameBtn">
                                <i class="fas fa-redo"></i>
                                New Game
                            </button>
                            <button class="game-btn secondary" id="aiBtn">
                                <i class="fas fa-robot"></i>
                                <span id="aiText">AI Play</span>
                            </button>
                        </div>
                    </div>

                    <!-- Game Board -->
                    <div class="game-board-container">
                        <div class="game-board" id="gameBoard">
                            <!-- Grid cells will be generated by JavaScript -->
                        </div>
                        
                        <!-- Game Over Screen -->
                        <div class="game-over" id="gameOverScreen">
                            <div class="game-over-content">
                                <h2 class="game-over-title" id="gameOverTitle">Game Over!</h2>
                                <p class="game-over-text">Try again to beat your best score!</p>
                                <div class="game-over-score">
                                    <div class="final-score">
                                        <span>Final Score</span>
                                        <span id="finalScore">0</span>
                                    </div>
                                </div>
                                <button class="game-btn primary" id="retryBtn">
                                    <i class="fas fa-redo"></i>
                                    Try Again
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Navigation Dots -->
    <nav class="nav-dots" id="navDots">
        <div class="nav-dot active" data-section="hero" title="Overview">
            <span class="dot-label">Overview</span>
        </div>
        <div class="nav-dot" data-section="play" title="Play">
            <span class="dot-label">Play</span>
        </div>
    </nav>

    <!-- Scripts -->
    <script src="../../js/script.js?v=20261008j"></script>
    <script src="app.js?v=20261008j"></script>
    
    <!-- Visitor Counter -->
    <script>
        fetch('https://lukas200301-counter.vercel.app/api/counter').catch(err => console.log('Counter:', err));
    </script>
</body>
</html>
