<body>
    <main class="game-page-no-nav">
        <section id="overview" class="game-hero">
            <div class="section-container">
                <div class="game-header">
                    <div class="game-info">
                        <div class="game-breadcrumb">
                            <a href="../../index.html" class="breadcrumb-link"><i class="fas fa-house"></i><span>Home</span></a>
                            <span class="breadcrumb-separator">/</span>
                            <a href="../index.html" class="breadcrumb-link"><i class="fas fa-gamepad"></i><span>Games</span></a>
                            <span class="breadcrumb-separator">/</span>
                            <span class="breadcrumb-current">Memory</span>
                        </div>
                        <h1 class="game-title">
                            <i class="fas fa-clone"></i>
                            Tech Memory
                        </h1>
                        <p class="game-description">Flip two cards at a time and match the logos. Fewer moves, better score.</p>
                        <div class="game-meta">
                            <div class="meta-item"><i class="fas fa-table-cells"></i><span>4×4 or 6×6</span></div>
                            <div class="meta-item"><i class="fas fa-trophy"></i><span>Best scores saved</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="app" class="game-section">
            <div class="section-container">
                <div class="app">
                    <div class="panel mm-bar">
                        <div class="seg" id="size" role="group" aria-label="Board size">
                            <button type="button" data-v="4" aria-pressed="true">4 × 4</button>
                            <button type="button" data-v="6" aria-pressed="false">6 × 6</button>
                        </div>
                        <div class="stats">
                            <div class="stat" id="sMoves"><b>0</b><span>Moves</span></div>
                            <div class="stat" id="sPairs"><b>0/8</b><span>Pairs</span></div>
                            <div class="stat" id="sTime"><b>0:00</b><span>Time</span></div>
                            <div class="stat" id="sBest"><b>–</b><span>Best</span></div>
                        </div>
                        <button class="btn btn--sm" id="newBtn"><i class="fas fa-shuffle"></i>New game</button>
                    </div>
                    <div class="panel mm-panel">
                        <div class="board-wrap">
                            <div class="mm" id="board"></div>
                            <div class="overlay-msg" id="msg" hidden>
                                <h3 id="msgTitle"></h3>
                                <p id="msgText"></p>
                                <div class="row"><button class="btn" id="againBtn"><i class="fas fa-shuffle"></i>Play again</button></div>
                            </div>
                        </div>
                    </div>
                    <p class="hint">Flip two cards per move. Matching pairs stay open. Best score = fewest moves for each board size.</p>
                </div>
                <style>
                    .mm-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; }
                    .mm-bar .stat { min-width: 80px; padding: 6px 12px; }
                    .mm-bar .stat b { font-size: 1.1rem; }
                    .mm-panel { padding: clamp(12px, 2vw, 24px); }
                    .mm { --n: 4; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: clamp(6px, 1.2vw, 14px); width: min(100%, calc(var(--n) * 130px)); margin: 0 auto; perspective: 900px; }
                    .mm-card { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .55s var(--ease-out); animation: mm-deal .5s var(--ease-out) backwards; animation-delay: var(--d); -webkit-tap-highlight-color: transparent; }
                    @keyframes mm-deal { from { opacity: 0; transform: translateY(-30px) rotateZ(-8deg) scale(.8); } }
                    .mm-card.up, .mm-card.done { transform: rotateY(180deg); }
                    .mm-card:not(.up):not(.done):hover .mm-back { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(142,162,255,.12); }
                    .mm-face, .mm-back { position: absolute; inset: 0; border-radius: clamp(8px, 1.2vw, 14px); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; transition: border-color .2s, box-shadow .2s, background-color .3s; }
                    .mm-back { border: 1px solid rgba(142,162,255,.25); background: radial-gradient(circle at 30% 25%, rgba(142,162,255,.22), transparent 60%), linear-gradient(160deg, #1f2a50, #121a30); }
                    .mm-back::after { content: ''; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(142,162,255,.35); box-shadow: 0 0 0 6px rgba(142,162,255,.07), inset 0 0 0 6px rgba(142,162,255,.07); }
                    .mm-face { transform: rotateY(180deg); border: 1px solid var(--line); background: linear-gradient(160deg, #18213d, #0d1325); }
                    .mm-face i { font-size: calc(min(100vw, var(--n) * 130px) / var(--n) * .42); color: var(--ic); filter: drop-shadow(0 0 12px color-mix(in srgb, var(--ic) 35%, transparent)); }
                    .mm-face small { position: absolute; bottom: 6%; font-size: clamp(.55rem, .5rem + .3vw, .75rem); color: var(--fg-3); }
                    .mm[style*="--n: 6"] .mm-face small, .mm[style*="--n:6"] .mm-face small { display: none; }
                    .mm-card.done .mm-face { border-color: rgba(94,230,181,.5); background: linear-gradient(160deg, rgba(94,230,181,.12), #0d1325); }
                    .mm-card.match { animation: mm-match .6s var(--ease-spring); }
                    @keyframes mm-match { 0% { transform: rotateY(180deg); } 40% { transform: rotateY(180deg) scale(1.1); } 100% { transform: rotateY(180deg); } }
                    .mm-card.miss .mm-face { border-color: var(--rose); animation: mm-miss .4s; }
                    @keyframes mm-miss { 20%, 60% { transform: rotateY(180deg) translateX(5px); } 40%, 80% { transform: rotateY(180deg) translateX(-5px); } }
                </style>
            </div>
        </section>
